<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Knights Network - Admin</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #fff;
            font-size: 24px;
            font-weight: 600;
        }

        .nav {
            display: flex;
            gap: 16px;
        }

        .nav a {
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .nav a:hover {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .nav a.active {
            background: rgba(99, 102, 241, 0.2);
            color: #a5b4fc;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }

        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .card h2 {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .card .value {
            color: #fff;
            font-size: 32px;
            font-weight: 600;
        }

        .card .subtitle {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            margin-top: 4px;
        }

        .section {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 20px;
        }

        .section h3 {
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 16px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-item label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
        }

        .info-item span {
            color: #fff;
            font-size: 14px;
        }

        .info-item code {
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            font-family: monospace;
            color: #a5b4fc;
            font-size: 13px;
        }

        .btn {
            padding: 12px 20px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.15);
            box-shadow: none;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        .message {
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .message.success {
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid rgba(34, 197, 94, 0.3);
            color: #22c55e;
            display: block;
        }

        .message.error {
            background: rgba(239, 68, 68, 0.2);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #ef4444;
            display: block;
        }

        .loading {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
        }

        .auto-refresh {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .auto-refresh label {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .auto-refresh input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .auto-refresh select {
            padding: 6px 10px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 6px;
            color: #fff;
            font-size: 13px;
            cursor: pointer;
        }

        .auto-refresh select:focus {
            outline: none;
            border-color: #6366f1;
        }

        .last-update {
            color: rgba(255, 255, 255, 0.4);
            font-size: 12px;
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Knights Network Admin</h1>
            <nav class="nav">
                <a href="/admin" class="active">Dashboard</a>
                <a href="/admin/accounts">Comptes</a>
                <a href="/register">Inscription</a>
            </nav>
        </div>

        <div id="message" class="message"></div>

        <div class="grid">
            <div class="card">
                <h2>Utilisateurs connectes</h2>
                <div class="value" id="users-count">-</div>
                <div class="subtitle" id="users-detail"></div>
            </div>
            <div class="card">
                <h2>Channels actifs</h2>
                <div class="value" id="channels-count">-</div>
            </div>
            <div class="card">
                <h2>Serveurs</h2>
                <div class="value" id="servers-count">-</div>
            </div>
        </div>

        <div class="section">
            <h3>Informations serveur</h3>
            <div class="info-grid">
                <div class="info-item">
                    <label>Version Ergo</label>
                    <code id="version">-</code>
                </div>
                <div class="info-item">
                    <label>Version Go</label>
                    <code id="go-version">-</code>
                </div>
                <div class="info-item">
                    <label>Demarrage</label>
                    <span id="start-time">-</span>
                </div>
            </div>
            <div class="actions">
                <button class="btn" id="rehash-btn" onclick="rehash()">Recharger la configuration</button>
                <button class="btn btn-secondary" onclick="loadStatus()">Actualiser</button>
            </div>
            <div class="auto-refresh">
                <label>
                    <input type="checkbox" id="auto-refresh-toggle" onchange="toggleAutoRefresh()">
                    Rafraichissement auto
                </label>
                <select id="refresh-interval" onchange="updateRefreshInterval()">
                    <option value="5">5 sec</option>
                    <option value="10" selected>10 sec</option>
                    <option value="30">30 sec</option>
                    <option value="60">1 min</option>
                </select>
                <span class="last-update" id="last-update"></span>
            </div>
        </div>
    </div>

    <script>
        const message = document.getElementById('message');
        let refreshInterval = null;
        let refreshSeconds = 10;

        async function loadStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();

                if (data.success) {
                    document.getElementById('version').textContent = data.version || '-';
                    document.getElementById('go-version').textContent = data.go_version || '-';

                    if (data.start_time) {
                        const startDate = new Date(data.start_time);
                        document.getElementById('start-time').textContent = startDate.toLocaleString('fr-FR');
                    }

                    // Users
                    const users = data.users || {};
                    const totalUsers = users.total || 0;
                    document.getElementById('users-count').textContent = totalUsers;

                    const invisible = users.invisible || 0;
                    const operators = users.operators || 0;
                    const details = [];
                    if (invisible > 0) details.push(`${invisible} invisible(s)`);
                    if (operators > 0) details.push(`${operators} operateur(s)`);
                    document.getElementById('users-detail').textContent = details.join(', ') || '';

                    // Channels
                    document.getElementById('channels-count').textContent = data.channels || 0;

                    // Servers
                    document.getElementById('servers-count').textContent = data.servers || 1;

                    // Update last refresh time
                    updateLastRefresh();
                } else {
                    showMessage(data.error || 'Erreur lors du chargement', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
            }
        }

        function updateLastRefresh() {
            const now = new Date();
            document.getElementById('last-update').textContent =
                'Mis a jour: ' + now.toLocaleTimeString('fr-FR');
        }

        function toggleAutoRefresh() {
            const enabled = document.getElementById('auto-refresh-toggle').checked;
            if (enabled) {
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        function startAutoRefresh() {
            stopAutoRefresh();
            refreshInterval = setInterval(loadStatus, refreshSeconds * 1000);
        }

        function stopAutoRefresh() {
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
        }

        function updateRefreshInterval() {
            refreshSeconds = parseInt(document.getElementById('refresh-interval').value);
            if (document.getElementById('auto-refresh-toggle').checked) {
                startAutoRefresh();
            }
        }

        async function rehash() {
            const btn = document.getElementById('rehash-btn');
            btn.disabled = true;
            btn.textContent = 'Rechargement...';

            try {
                const response = await fetch('/api/rehash', { method: 'POST' });
                const data = await response.json();

                if (response.ok) {
                    showMessage('Configuration rechargee avec succes', 'success');
                } else {
                    showMessage(data.error || 'Erreur lors du rehash', 'error');
                }
            } catch (error) {
                showMessage('Erreur de connexion au serveur', 'error');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Recharger la configuration';
            }
        }

        function showMessage(text, type) {
            message.textContent = text;
            message.className = 'message ' + type;
            setTimeout(() => {
                message.className = 'message';
            }, 5000);
        }

        // Charger le statut au demarrage
        loadStatus();
    </script>
</body>
</html>
