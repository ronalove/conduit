services:
  registration:
    image: ghcr.io/ronalove/knights-registration:latest
    container_name: knights-registration
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ERGO_API_URL=${ERGO_API_URL:-http://ergo:8089}
      - ERGO_API_TOKEN=${ERGO_API_TOKEN}
      - PORT=8080
    networks:
      - ircd_default

networks:
  ircd_default:
    external: true
